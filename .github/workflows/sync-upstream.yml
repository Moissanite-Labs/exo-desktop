name: Prepare upstream sync draft

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exo-desktop-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Moissanite-Labs/exo-desktop' && (github.event_name == 'workflow_dispatch' || vars.EXO_SYNC_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require an owner-provided sync credential
        env:
          EXO_SYNC_TOKEN: ${{ secrets.EXO_SYNC_TOKEN }}
        run: |
          if [ -z "$EXO_SYNC_TOKEN" ]; then
            echo '::error::EXO_SYNC_TOKEN is missing. See CONTINUITY.md. No sync was attempted.'
            exit 1
          fi
      - name: Read trusted fork main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.EXO_SYNC_TOKEN }}
          persist-credentials: false
          clean: false
      - name: Prepare or update the draft sync PR
        env:
          EXO_SYNC_TOKEN: ${{ secrets.EXO_SYNC_TOKEN }}
        run: >-
          python3 scripts/sync_upstream.py
          --work-dir "$RUNNER_TEMP/exo-sync-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          --report-failures
